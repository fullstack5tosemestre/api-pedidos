databaseChangeLog:
  - changeSet:
      id: 002-create-product-quantity
      author: jenny
      changes:
        - createTable:
            tableName: product_quantity
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
              - column:
                  name: quantity
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: product_quantity
            baseColumnNames: id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_product_quantity_order
            onDelete: CASCADE
