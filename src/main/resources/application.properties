# ==========================================
# Configuracion servidor
# ==========================================
server.port=8081

# ==========================================
# Base de datos MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ==========================================
# URL de la API de Inventario del companero
# Cambiar por la IP publica cuando este en la nube
# ==========================================
inventory.api.base-url=http://localhost:9090/api/v1/products

# ==========================================
# Swagger UI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# Liquibase
# ==========================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
