# ==========================================
# Configuracion servidor
# ==========================================
server.port=8081

# ==========================================
# Base de datos MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# URL de la API de Inventario del companero
# Cambiar por la IP publica cuando este en la nube
# ==========================================
inventory.api.base-url=http://localhost:9090

# ==========================================
# Swagger UI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
